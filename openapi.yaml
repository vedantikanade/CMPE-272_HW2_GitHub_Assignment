openapi: 3.1.0
info:
  title: GitHub Issues Gateway API
  description: API Gateway proxying GitHub Issues CRUD and processing Webhooks
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health Check
      description: Health check endpoint evaluating DB connectivity and service readiness.
      operationId: health_check_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /events:
    get:
      summary: List Events
      description: Retrieves audit history of processed webhook events from SQLite.
      operationId: list_events_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues:
    post:
      summary: Create Issue
      operationId: create_issue_issues_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Issues
      operationId: list_issues_issues_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          enum:
          - open
          - closed
          - all
          type: string
          default: open
          title: State
      - name: labels
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Labels
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Per Page
      - name: If-None-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-None-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{number}:
    get:
      summary: Get Issue
      operationId: get_issue_issues__number__get
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Update Issue
      operationId: update_issue_issues__number__patch
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{number}/comments:
    post:
      summary: Add Comment
      operationId: add_comment_issues__number__comments_post
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook:
    post:
      summary: Handle Webhook
      operationId: handle_webhook_webhook_post
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: false
        schema:
          type: string
          title: X-Hub-Signature-256
      - name: X-GitHub-Event
        in: header
        required: false
        schema:
          type: string
          title: X-Github-Event
      - name: X-GitHub-Delivery
        in: header
        required: false
        schema:
          type: string
          title: X-Github-Delivery
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CommentCreateSchema:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
          description: Comment body is required
      type: object
      required:
      - body
      title: CommentCreateSchema
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IssueCreateSchema:
      properties:
        title:
          type: string
          minLength: 1
          title: Title
          description: Issue title is required
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
      type: object
      required:
      - title
      title: IssueCreateSchema
    IssueUpdateSchema:
      properties:
        title:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        state:
          anyOf:
          - type: string
            enum:
            - open
            - closed
          - type: 'null'
          title: State
      type: object
      title: IssueUpdateSchema
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
